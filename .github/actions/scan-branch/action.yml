name: Scan a git ref for vulnerabilities
description: >-
  Checks out the given ref in the already-cloned repo, runs OSV-Scanner and
  npm audit/list, and returns combined Markdown reports.

inputs:
  ref:
    description: Git ref to check out and scan
    required: true
  node-version:
    description: Node.js version to use
    required: true
  warning-label:
    description: >-
      Label used in the ::warning:: annotation if npm audit/list report
      generation fails (e.g. "the base branch scan")
    required: true
  private-repo-orgs:
    description: >-
      Optional whitespace-separated list of GitHub organization or user names
      whose private repositories are used as npm dependencies. git URLs for
      these orgs are rewritten to token-authenticated HTTPS so the lockfile
      can be generated. Requires `private-repo-token`.
    required: false
    default: ''
  npm-registry-url:
    description: >-
      Optional npm registry URL (e.g. `https://npm.pkg.github.com`) to
      authenticate against using `npm-registry-token`.
    required: false
    default: ''
  private-repo-token:
    description: >-
      Optional token with read access to the private repositories named by
      `private-repo-orgs`. Also used as the `npm-registry-token` fallback.
    required: false
    default: ''
  npm-registry-token:
    description: >-
      Optional token with read access to the packages served by
      `npm-registry-url`. Falls back to `private-repo-token` when unset, so a
      caller using one token for both only needs to set that one.
    required: false
    default: ''

outputs:
  osv-result:
    description: OSV-Scanner Markdown report
    value: ${{ steps.read_results.outputs.content }}
  audit-list-result:
    description: Combined npm audit + npm list Markdown report
    value: ${{ steps.combine.outputs.result }}

runs:
  using: composite
  steps:
    # Catch opt-in private repo settings that can't work, so they fail here
    # with an explanation rather than as an opaque npm auth error later.
    - name: Validate private repository inputs
      shell: bash
      env:
        PRIVATE_REPO_ORGS: ${{ inputs.private-repo-orgs }}
        NPM_REGISTRY_URL: ${{ inputs.npm-registry-url }}
        # Presence only; the token values themselves stay out of this step.
        HAS_REPO_TOKEN: ${{ inputs.private-repo-token != '' }}
        HAS_NPM_TOKEN: ${{ inputs.npm-registry-token != '' }}
      run: |
        if [ -n "$PRIVATE_REPO_ORGS" ] && [ "$HAS_REPO_TOKEN" != "true" ]; then
          echo "::error::'private-repo-orgs' was set but no 'PRIVATE_REPO_TOKEN' secret was provided."
          exit 1
        fi
        if [ -n "$NPM_REGISTRY_URL" ] && [ "$HAS_NPM_TOKEN" != "true" ] \
            && [ "$HAS_REPO_TOKEN" != "true" ]; then
          echo "::warning::'npm-registry-url' was set but neither the 'NPM_REGISTRY_TOKEN' nor the 'PRIVATE_REPO_TOKEN' secret was provided; npm will authenticate to it with an empty token."
        fi
        if [ "$HAS_NPM_TOKEN" = "true" ] && [ -z "$NPM_REGISTRY_URL" ]; then
          echo "::warning::The 'NPM_REGISTRY_TOKEN' secret was provided but 'npm-registry-url' is unset, so the token will not be used."
        fi
        # Reject anything that isn't a plain org/user name, so the input
        # can't smuggle extra git config keys into the rewrite below.
        set -f
        for org in $PRIVATE_REPO_ORGS; do
          case "$org" in
            *[!A-Za-z0-9._-]*|"")
              echo "::error::'private-repo-orgs' entry '$org' is not a valid GitHub organization or user name."
              exit 1
              ;;
          esac
        done
    - name: Checkout ref to scan
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: |
        if [ -z "$REF" ]; then
          echo "::error::scan-branch action's 'ref' input is required and was empty."
          exit 1
        fi
        git checkout -f "$REF"
        git submodule update --recursive
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        # Only configures npm authentication when non-empty, so an unset
        # `npm-registry-url` leaves `.npmrc` alone.
        registry-url: ${{ inputs.npm-registry-url }}
    - name: Does package-lock.json exist?
      id: has_package_lock
      uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
      with:
        files: "package-lock.json"
    # Let npm resolve private GitHub repo dependencies, when the caller opted
    # in by supplying both a token and one or more orgs. Covers the ssh, scp
    # and https URL forms npm can produce for a GitHub dependency.
    - name: Configure git for private GitHub repositories
      if: inputs.private-repo-orgs != '' && inputs.private-repo-token != ''
      shell: bash
      env:
        PRIVATE_REPO_ORGS: ${{ inputs.private-repo-orgs }}
        PRIVATE_REPO_TOKEN: ${{ inputs.private-repo-token }}
      run: |
        set -f
        for org in $PRIVATE_REPO_ORGS; do
          auth="https://${PRIVATE_REPO_TOKEN}@github.com/${org}/"
          # `url.<base>.insteadOf` is multi-valued, hence `--add` per form.
          git config --global --add url."$auth".insteadOf "ssh://git@github.com/${org}/"
          git config --global --add url."$auth".insteadOf "git@github.com:${org}/"
          git config --global --add url."$auth".insteadOf "https://github.com/${org}/"
        done
    - name: Generate `package-lock.json`
      if: steps.has_package_lock.outputs.files_exists == 'false'
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-registry-token || inputs.private-repo-token }}
      run: |
        npm install --package-lock-only --ignore-scripts
    - name: "Run scanner on code and generate Markdown"
      uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
      continue-on-error: true
      with:
        scan-args: |-
          --format=markdown
          --output-file=osv-results.md
          --lockfile=package-lock.json
    - name: Store results in variable
      id: read_results
      uses: juliangruber/read-file-action@271ff311a4947af354c6abcd696a306553b9ec18 # v1.1.8
      with:
        path: osv-results.md
        trim: true
    # Run npm audit and npm list to build up additional report explanations
    - name: npm audit
      id: npm_audit
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-registry-token || inputs.private-repo-token }}
      run: |
        # Use a random delimiter to capture the multi-line output
        delimiter=$(openssl rand -hex 8)
        echo "result<<$delimiter" >> $GITHUB_OUTPUT
        npm audit --json >> $GITHUB_OUTPUT || true
        echo "$delimiter" >> $GITHUB_OUTPUT
    # Use `jq` to create a Markdown table of the findings
    - name: npm audit report
      id: audit_report
      shell: bash
      env:
        STEPS_NPM_AUDIT_OUTPUTS_RESULT: ${{ steps.npm_audit.outputs.result }}
      run: |
        AUDIT=$(echo "$STEPS_NPM_AUDIT_OUTPUTS_RESULT" | jq -r '
          if (.vulnerabilities | length) == 0 then
            "No vulnerabilities found."
          else
            "| Severity | Name | Version | Fix Available |",
            "| --- | --- | --- | --- |",
            (.vulnerabilities | to_entries | .[] |
              "| \(.value.severity) | \(.key) | \(.value.range) | \(
                if (.value.fixAvailable | type) == "object"
                then (.value.fixAvailable.name // .key) + "@" + .value.fixAvailable.version
                else (.value.fixAvailable | tostring)
                end
              ) |"
            )
          end')
        # Use a random delimiter to capture the multi-line output
        delimiter=$(openssl rand -hex 8)
        echo "result<<$delimiter" >> $GITHUB_OUTPUT
        echo "$AUDIT" >> $GITHUB_OUTPUT
        echo "$delimiter" >> $GITHUB_OUTPUT
      continue-on-error: true
    # Generate a tree/list based on the vulnerable package names
    - name: npm list vulnerable dependencies
      id: list_report
      shell: bash
      env:
        STEPS_NPM_AUDIT_OUTPUTS_RESULT: ${{ steps.npm_audit.outputs.result }}
        NODE_AUTH_TOKEN: ${{ inputs.npm-registry-token || inputs.private-repo-token }}
      run: |
        DEPS=$(echo "$STEPS_NPM_AUDIT_OUTPUTS_RESULT" | jq -r '[.vulnerabilities | to_entries[] | .key] | join(" ")')
        if [ -z "$DEPS" ]; then
          LIST=""
        else
          LIST=$(npm list $DEPS --json --package-lock-only | jq -r '
            def walk_tree(prefix):
              to_entries | map(
                "\(prefix)\(.key)@\(.value.version)\n" +
                if .value.dependencies then
                  (.value.dependencies | walk_tree("  " + prefix))
                else
                  ""
                end
              ) | join("");
            .dependencies | walk_tree("* ")')
        fi
        # Use a random delimiter to capture the multi-line output
        delimiter=$(openssl rand -hex 8)
        echo "result<<$delimiter" >> $GITHUB_OUTPUT
        echo "$LIST" >> $GITHUB_OUTPUT
        echo "$delimiter" >> $GITHUB_OUTPUT
      continue-on-error: true
    # audit_report/list_report are continue-on-error since they only report
    # on npm audit/list; a real bug there shouldn't block the OSV scan
    # results, but it should still be visible.
    - name: Warn if npm audit/list report generation failed
      if: steps.audit_report.outcome == 'failure' || steps.list_report.outcome == 'failure'
      shell: bash
      env:
        LABEL: ${{ inputs.warning-label }}
        AUDIT_REPORT_OUTCOME: ${{ steps.audit_report.outcome }}
        LIST_REPORT_OUTCOME: ${{ steps.list_report.outcome }}
      run: |
        echo "::warning::npm audit/list report generation failed for $LABEL (audit_report=$AUDIT_REPORT_OUTCOME, list_report=$LIST_REPORT_OUTCOME). The npm audit/list section of this report may be missing or incomplete; see step logs."
    # Combine the two Markdown reports into one for use elsewhere
    - name: combine npm audit/list reports
      id: combine
      shell: bash
      env:
        STEPS_AUDIT_REPORT_OUTPUTS_RESULT: ${{ steps.audit_report.outputs.result }}
        STEPS_LIST_REPORT_OUTPUTS_RESULT: ${{ steps.list_report.outputs.result }}
      run: |
        RESULT=$(printf '## npm audit\n\n%s' "$STEPS_AUDIT_REPORT_OUTPUTS_RESULT")
        # Omit the npm list section entirely when there's nothing to list,
        # rather than an empty, heading-only <details> block.
        if [ -n "$STEPS_LIST_REPORT_OUTPUTS_RESULT" ]; then
          RESULT=$(printf '%s\n\n<details>\n<summary>npm list</summary>\n\n%s\n\n</details>' "$RESULT" "$STEPS_LIST_REPORT_OUTPUTS_RESULT")
        fi
        # Use a random delimiter to capture the multi-line output
        delimiter=$(openssl rand -hex 8)
        echo "result<<$delimiter" >> $GITHUB_OUTPUT
        echo "$RESULT" >> $GITHUB_OUTPUT
        echo "$delimiter" >> $GITHUB_OUTPUT
    # Don't leave the token sitting in the runner's global git config for the
    # rest of the job; `osv-scanner-pr.yaml` runs this action twice, and the
    # caller may run further steps afterwards.
    - name: Remove private repository git credentials
      if: always() && inputs.private-repo-orgs != '' && inputs.private-repo-token != ''
      shell: bash
      env:
        PRIVATE_REPO_ORGS: ${{ inputs.private-repo-orgs }}
        PRIVATE_REPO_TOKEN: ${{ inputs.private-repo-token }}
      run: |
        set -f
        for org in $PRIVATE_REPO_ORGS; do
          # Removing the section drops all of the `insteadOf` values at once.
          # It's not an error if it isn't there: this step also runs when the
          # action failed before the config was written.
          git config --global --remove-section \
            url."https://${PRIVATE_REPO_TOKEN}@github.com/${org}/" 2>/dev/null || true
        done
