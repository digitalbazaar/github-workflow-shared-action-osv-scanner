# OSV-Scanner PR scanning reusable workflow, can be used as a PR action to
# detect new vulnerabilities being introduced.
name: Use OSV to do SCA on a PR

on:
  workflow_call:

jobs:
  ## run the following on PRs
  osv-scan-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          # Do persist credentials, as we need it for the git checkout later
          persist-credentials: true
      - name: "Checkout base branch"
        run: |
          git checkout $GITHUB_BASE_REF
          git submodule update --recursive
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Does package-lock.json exist?
        id: base_package_lock
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: "package-lock.json"
      - name: Generate `package-lock.json`
        if: steps.base_package_lock.outputs.files_exists == 'false'
        run: |
          npm install --package-lock-only --ignore-scripts
      - name: "Run scanner on existing code and generate Markdown"
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        continue-on-error: true
        with:
          scan-args: |-
            --format=markdown
            --output=old-results.md
            --lockfile=package-lock.json
      - name: Store old results in variable
        continue-on-error: true
        id: old
        uses: juliangruber/read-file-action@271ff311a4947af354c6abcd696a306553b9ec18 # v1.1.8
        with:
          path: old-results.md
      # Run npm audit and npm list to build up additional report explanations
      - name: npm audit
        id: npm_audit_base
        shell: bash
        run: |
          # Use a random delimiter to capture the multi-line output
          delimiter=$(openssl rand -hex 8)
          echo "result<<$delimiter" >> $GITHUB_OUTPUT
          npm audit --json >> $GITHUB_OUTPUT || true
          echo "$delimiter" >> $GITHUB_OUTPUT
        continue-on-error: true
      # Use `jq` to create a Markdown table of the findings
      - name: npm audit
        id: audit_report_base
        shell: bash
        env:
          STEPS_NPM_AUDIT_BASE_OUTPUTS_RESULT: ${{ steps.npm_audit_base.outputs.result }}
        run: |
          AUDIT=$(echo "$STEPS_NPM_AUDIT_BASE_OUTPUTS_RESULT" | jq -r '
            "| Severity | Name | Version | Fix Available |",
            "| --- | --- | --- | --- |",
            (.vulnerabilities | to_entries | .[] |
              "| \(.value.severity) | \(.key) | \(.value.range) | \(
                if (.value.fixAvailable | type) == "object"
                then .value.fixAvailable.version
                else (.value.fixAvailable | tostring)
                end
              ) |"
            )')
          # Use a random delimiter to capture the multi-line output
          delimiter=$(openssl rand -hex 8)
          echo "result<<$delimiter" >> $GITHUB_OUTPUT
          echo "$AUDIT" >> $GITHUB_OUTPUT
          echo "$delimiter" >> $GITHUB_OUTPUT
        continue-on-error: true
      # Generate a tree/list based on the vulnerable package names
      - name: npm list vulnerable dependencies
        id: list_report_base
        shell: bash
        env:
          STEPS_NPM_AUDIT_BASE_OUTPUTS_RESULT: ${{ steps.npm_audit_base.outputs.result }}
        run: |
          DEPS=$(echo "$STEPS_NPM_AUDIT_BASE_OUTPUTS_RESULT" | jq -r '[.vulnerabilities | to_entries[] | .key] | join(" ")')
          if [ -z "$DEPS" ]; then
            LIST=""
          else
            LIST=$(npm list $DEPS --json --package-lock-only | jq -r '
              def walk_tree(prefix):
                to_entries | map(
                  "\(prefix)\(.key)@\(.value.version)\n" +
                  if .value.dependencies then
                    (.value.dependencies | walk_tree("  " + prefix))
                  else
                    ""
                  end
                ) | join("");
              .dependencies | walk_tree("* ")')
          fi
          # Use a random delimiter to capture the multi-line output
          delimiter=$(openssl rand -hex 8)
          echo "result<<$delimiter" >> $GITHUB_OUTPUT
          echo "$LIST" >> $GITHUB_OUTPUT
          echo "$delimiter" >> $GITHUB_OUTPUT
        continue-on-error: true
      # Combine the two Markdown reports into one for use elsewhere
      - name: combine npm audit/list reports
        id: old_audit_list_report
        shell: bash
        env:
          STEPS_AUDIT_REPORT_BASE_OUTPUTS_RESULT: ${{ steps.audit_report_base.outputs.result }}
          STEPS_LIST_REPORT_BASE_OUTPUTS_RESULT: ${{ steps.list_report_base.outputs.result }}
        run: |
          # Use a random delimiter to capture the multi-line output
          delimiter=$(openssl rand -hex 8)
          echo "result<<$delimiter" >> $GITHUB_OUTPUT
          echo "### npm audit

          ${STEPS_AUDIT_REPORT_BASE_OUTPUTS_RESULT}

          <details>
          <summary>npm list</summary>

          ${STEPS_LIST_REPORT_BASE_OUTPUTS_RESULT}

          </details>
          " >> $GITHUB_OUTPUT
          echo "$delimiter" >> $GITHUB_OUTPUT

      # --- run the same on the current branch ---
      - name: "Checkout current branch"
        # Use -f in case any changes were made by osv-scanner (there should be no changes)
        run: |
          git checkout -f $GITHUB_SHA
          git submodule update --recursive
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Does package-lock.json exist?
        id: current_package_lock
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: "package-lock.json"
      - name: Generate `package-lock.json`
        if: steps.current_package_lock.outputs.files_exists == 'false'
        run: |
          npm install --package-lock-only --ignore-scripts
      # post the generated markdown as a comment
      - name: "Run scanner on new code and generate Markdown"
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --format=markdown
            --output=new-results.md
            --lockfile=package-lock.json
        continue-on-error: true
      - name: Store new results in variable
        id: new
        uses: juliangruber/read-file-action@271ff311a4947af354c6abcd696a306553b9ec18 # v1.1.8
        with:
          path: new-results.md

      # Run npm audit and npm list to build up additional report explanations
      - name: npm audit
        id: npm_audit
        shell: bash
        run: |
          # Use a random delimiter to capture the multi-line output
          delimiter=$(openssl rand -hex 8)
          echo "result<<$delimiter" >> $GITHUB_OUTPUT
          npm audit --json >> $GITHUB_OUTPUT || true
          echo "$delimiter" >> $GITHUB_OUTPUT
        continue-on-error: true
      # Use `jq` to create a Markdown table of the findings
      - name: npm audit
        id: audit_report
        shell: bash
        env:
          STEPS_NPM_AUDIT_OUTPUTS_RESULT: ${{ steps.npm_audit.outputs.result }}
        run: |
          AUDIT=$(echo "$STEPS_NPM_AUDIT_OUTPUTS_RESULT" | jq -r '
            "| Severity | Name | Version | Fix Available |",
            "| --- | --- | --- | --- |",
            (.vulnerabilities | to_entries | .[] |
              "| \(.value.severity) | \(.key) | \(.value.range) | \(
                if (.value.fixAvailable | type) == "object"
                then .value.fixAvailable.version
                else (.value.fixAvailable | tostring)
                end
              ) |"
            )')
          # Use a random delimiter to capture the multi-line output
          delimiter=$(openssl rand -hex 8)
          echo "result<<$delimiter" >> $GITHUB_OUTPUT
          echo "$AUDIT" >> $GITHUB_OUTPUT
          echo "$delimiter" >> $GITHUB_OUTPUT
        continue-on-error: true
      # Generate a tree/list based on the vulnerable package names
      - name: npm list vulnerable dependencies
        id: list_report
        shell: bash
        env:
          STEPS_NPM_AUDIT_OUTPUTS_RESULT: ${{ steps.npm_audit.outputs.result }}
        run: |
          DEPS=$(echo "$STEPS_NPM_AUDIT_OUTPUTS_RESULT" | jq -r '[.vulnerabilities | to_entries[] | .key] | join(" ")')
          if [ -z "$DEPS" ]; then
            LIST=""
          else
            LIST=$(npm list $DEPS --json --package-lock-only | jq -r '
              def walk_tree(prefix):
                to_entries | map(
                  "\(prefix)\(.key)@\(.value.version)\n" +
                  if .value.dependencies then
                    (.value.dependencies | walk_tree("  " + prefix))
                  else
                    ""
                  end
                ) | join("");
              .dependencies | walk_tree("* ")')
          fi
          # Use a random delimiter to capture the multi-line output
          delimiter=$(openssl rand -hex 8)
          echo "result<<$delimiter" >> $GITHUB_OUTPUT
          echo "$LIST" >> $GITHUB_OUTPUT
          echo "$delimiter" >> $GITHUB_OUTPUT
        continue-on-error: true
      # Combine the two Markdown reports into one for use elsewhere
      - name: combine npm audit/list reports
        id: new_audit_list_report
        shell: bash
        env:
          STEPS_AUDIT_REPORT_OUTPUTS_RESULT: ${{ steps.audit_report.outputs.result }}
          STEPS_LIST_REPORT_OUTPUTS_RESULT: ${{ steps.list_report.outputs.result }}
        run: |
          # Use a random delimiter to capture the multi-line output
          delimiter=$(openssl rand -hex 8)
          echo "result<<$delimiter" >> $GITHUB_OUTPUT
          echo "### npm audit

          ${STEPS_AUDIT_REPORT_OUTPUTS_RESULT}

          <details>
          <summary>npm list</summary>

          ${STEPS_LIST_REPORT_OUTPUTS_RESULT}

          </details>
          " >> $GITHUB_OUTPUT
          echo "$delimiter" >> $GITHUB_OUTPUT

      # If the base and PR results are identical, avoid posting two walls of
      # duplicate Markdown; just note that nothing changed.
      - name: Build PR comment message
        id: build_comment
        shell: bash
        env:
          OLD_OSV: ${{ steps.old.outputs.content }}
          NEW_OSV: ${{ steps.new.outputs.content }}
          OLD_EXTRA: ${{ steps.old_audit_list_report.outputs.result }}
          NEW_EXTRA: ${{ steps.new_audit_list_report.outputs.result }}
        run: |
          # Use a random delimiter to capture the multi-line output
          delimiter=$(openssl rand -hex 8)
          echo "message<<$delimiter" >> "$GITHUB_OUTPUT"
          if [ "$OLD_OSV" == "$NEW_OSV" ] && [ "$OLD_EXTRA" == "$NEW_EXTRA" ]; then
            echo "## Vulnerability results" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "No change from base branch." >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "$NEW_OSV" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "$NEW_EXTRA" >> "$GITHUB_OUTPUT"
          else
            echo "## Vulnerability results from base branch" >> "$GITHUB_OUTPUT"
            echo "$OLD_OSV" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "$OLD_EXTRA" >> "$GITHUB_OUTPUT"
            echo "---" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "## Vulnerability results from current PR branch" >> "$GITHUB_OUTPUT"
            echo "$NEW_OSV" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "$NEW_EXTRA" >> "$GITHUB_OUTPUT"
          fi
          echo "$delimiter" >> "$GITHUB_OUTPUT"

      # Combine OSV, npm audit, and npm list output into a single comment
      - name: Add a comment containing OSV, npm audit, and npm list output
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          comment-tag: action_report
          message: ${{ steps.build_comment.outputs.message }}
