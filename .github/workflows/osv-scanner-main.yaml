# OSV-Scanner PR scanning reusable workflow, can be used as a PR action to
# detect new vulnerabilities being introduced.
name: Use OSV to do SCA on `main`

on:
  workflow_call:

jobs:
  ## run the following only on the main branch
  osv-scan-main:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Set current date to NOW env variable
        run: echo "NOW=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          # Do persist credentials, as we need it for the git checkout later
          persist-credentials: true
      - name: "Checkout base branch"
        run: |
          git checkout $GITHUB_BASE_REF
          git submodule update --recursive
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Does package-lock.json exist?
        id: has_package_lock
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: "package-lock.json"
      - name: Generate `package-lock.json` from authorized sources
        if: steps.has_package_lock.outputs.files_exists == 'false'
        run: |
          npm install --package-lock-only --ignore-scripts
      - name: "Run scanner on existing code and generate Markdown"
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        continue-on-error: true
        with:
          scan-args: |-
            --format=markdown
            --output=results.md
            --lockfile=package-lock.json
      - name: Store results in variable
        id: results
        uses: juliangruber/read-file-action@271ff311a4947af354c6abcd696a306553b9ec18 # v1.1.8
        with:
          path: results.md
          trim: true
      # Run npm audit and npm list to build up additional report explanations
      - name: npm audit
        id: npm_audit
        shell: bash
        run: |
          # Use a random delimiter to capture the multi-line output
          delimiter=$(openssl rand -hex 8)
          echo "result<<$delimiter" >> $GITHUB_OUTPUT
          npm audit --json >> $GITHUB_OUTPUT || true
          echo "$delimiter" >> $GITHUB_OUTPUT
        continue-on-error: true
      # Use `jq` to create a Markdown table of the findings
      - name: npm audit
        id: audit_report
        shell: bash
        env:
          STEPS_NPM_AUDIT_OUTPUTS_RESULT: ${{ steps.npm_audit.outputs.result }}
        run: |
          AUDIT=$(echo "$STEPS_NPM_AUDIT_OUTPUTS_RESULT" | jq -r '
            "| Severity | Name | Version | Fix Available |",
            "| --- | --- | --- | --- |",
            (.vulnerabilities | to_entries | .[] |
              "| \(.value.severity) | \(.key) | \(.value.range) | \(
                if (.value.fixAvailable | type) == "object"
                then .value.fixAvailable.version
                else (.value.fixAvailable | tostring)
                end
              ) |"
            )')
          # Use a random delimiter to capture the multi-line output
          delimiter=$(openssl rand -hex 8)
          echo "result<<$delimiter" >> $GITHUB_OUTPUT
          echo "$AUDIT" >> $GITHUB_OUTPUT
          echo "$delimiter" >> $GITHUB_OUTPUT
        continue-on-error: true
      # Generate a tree/list based on the vulnerable package names
      - name: npm list vulnerable dependencies
        id: list_report
        shell: bash
        env:
          STEPS_NPM_AUDIT_OUTPUTS_RESULT: ${{ steps.npm_audit.outputs.result }}
        run: |
          DEPS=$(echo "$STEPS_NPM_AUDIT_OUTPUTS_RESULT" | jq -r '[.vulnerabilities | to_entries[] | .key] | join(" ")')
          if [ -z "$DEPS" ]; then
            LIST=""
          else
            LIST=$(npm list $DEPS --json --package-lock-only | jq -r '
              def walk_tree(prefix):
                to_entries | map(
                  "\(prefix)\(.key)@\(.value.version)\n" +
                  if .value.dependencies then
                    (.value.dependencies | walk_tree("  " + prefix))
                  else
                    ""
                  end
                ) | join("");
              .dependencies | walk_tree("* ")')
          fi
          # Use a random delimiter to capture the multi-line output
          delimiter=$(openssl rand -hex 8)
          echo "result<<$delimiter" >> $GITHUB_OUTPUT
          echo "$LIST" >> $GITHUB_OUTPUT
          echo "$delimiter" >> $GITHUB_OUTPUT
        continue-on-error: true
        # Combine the two Markdown reports into one for use elsewhere
      - name: combine npm audit/list reports
        id: audit_list_report
        shell: bash
        env:
          STEPS_AUDIT_REPORT_OUTPUTS_RESULT: ${{ steps.audit_report.outputs.result }}
          STEPS_LIST_REPORT_OUTPUTS_RESULT: ${{ steps.list_report.outputs.result }}
        run: |
          # Use a random delimiter to capture the multi-line output
          delimiter=$(openssl rand -hex 8)
          echo "result<<$delimiter" >> $GITHUB_OUTPUT
          echo "### npm audit

          ${STEPS_AUDIT_REPORT_OUTPUTS_RESULT}

          <details>
          <summary>npm list</summary>

          ${STEPS_LIST_REPORT_OUTPUTS_RESULT}

          </details>
          " >> $GITHUB_OUTPUT
          echo "$delimiter" >> $GITHUB_OUTPUT

      # Create the OSV label if it doesn't already exist
      - name: Create OSV label if it doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create OSV --color 033f72 --description "Vulnerabilities found by https://osv.dev/" || true
      - name: Find the most recent OSV issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: latest_issue
        # Note: this only finds the latest `OSV` labeled issue, so if there are
        # more than one OSV issue, those will be left alone.
        run: |
          ISSUE_NUM=$(gh issue list --search 'label:OSV sort:created-desc' --limit 1 --json number --jq .[].number)
          echo "content=$ISSUE_NUM" >> $GITHUB_OUTPUT
      - name: Update existing issue if vulnerabilities
        if: ${{ steps.latest_issue.outputs.content != '' && !contains(steps.results.outputs.content, 'No issues found') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ steps.results.outputs.content }}
          LATEST_ISSUE: ${{ steps.latest_issue.outputs.content }}
          STEPS_AUDIT_LIST_REPORT_OUTPUTS_RESULT: ${{ steps.audit_list_report.outputs.result }}
        run: |
          gh issue edit ${LATEST_ISSUE} --title "Vulnerabilities as of ${NOW}" --body "${ISSUE_BODY} ${STEPS_AUDIT_LIST_REPORT_OUTPUTS_RESULT}"
      - name: Close existing issue if no vulnerabilities
        if: ${{ steps.latest_issue.outputs.content != '' && contains(steps.results.outputs.content, 'No issues found') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_ISSUE: ${{ steps.latest_issue.outputs.content }}
          COMMENT: ${{ steps.results.outputs.content }}
          STEPS_AUDIT_LIST_REPORT_OUTPUTS_RESULT: ${{ steps.audit_list_report.outputs.result }}
        run: |
          gh issue close ${LATEST_ISSUE} --comment "${COMMENT} ${STEPS_AUDIT_LIST_REPORT_OUTPUTS_RESULT}"
      - name: Create issue from results
        if: ${{ steps.latest_issue.outputs.content == '' && !contains(steps.results.outputs.content, 'No issues found') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ steps.results.outputs.content }}
          STEPS_AUDIT_LIST_REPORT_OUTPUTS_RESULT: ${{ steps.audit_list_report.outputs.result }}
        run: |
          gh issue create --title "Vulnerabilities as of ${NOW}" --body "${ISSUE_BODY} ${STEPS_AUDIT_LIST_REPORT_OUTPUTS_RESULT}" --label OSV
